name: Publish client to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require publication approval
        env:
          RELEASES_APPROVED: ${{ vars.ASSIST_LIVE_RELEASES_APPROVED }}
        run: test "$RELEASES_APPROVED" = "true"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.9"
          python-version: "3.14.3"
      - run: uv sync --locked
        env:
          UV_LINK_MODE: copy
      - name: Check isolated client distribution
        run: uv run --locked python tools/check_ci.py --package client
      - name: Check repository asset rights
        run: uv run --locked python tools/check_assets.py --manifest assets/manifest.json --release
      - run: uv build --package assist-live-client
      - name: Check client wheel before publication
        run: |
          CLIENT_VERSION=$(uv run --locked python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("client/pyproject.toml").read_text())["project"]["version"])')
          uv run --locked python tools/check_release.py --wheel dist --assets assets/manifest.json --pypi-version "$CLIENT_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-dist
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Require publication approval
        env:
          RELEASES_APPROVED: ${{ vars.ASSIST_LIVE_RELEASES_APPROVED }}
        run: test "$RELEASES_APPROVED" = "true"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
