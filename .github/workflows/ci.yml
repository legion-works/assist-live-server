name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, unit, contract, packaging, asset-license, public-tree]
        python: ["3.14.3"]
        include:
          - check: unit
            python: "3.14.2"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python }}
      - uses: go-task/setup-task@0ab1b2a65bc55236a3bc64cde78f80e20e8885c2 # v1.0.0
        with:
          version: "3.51.1"
      - name: Install actionlint
        if: matrix.check == 'lint'
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tgz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install Gitleaks
        if: matrix.check == 'unit' || matrix.check == 'public-tree'
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
        env:
          UV_LINK_MODE: copy
      - name: Fetch pinned turn models
        if: matrix.check == 'unit'
        run: uv run --locked python tools/tune_profiles.py --fetch-models
      - run: task "$CHECK"
        if: matrix.check != 'public-tree'
        env:
          CHECK: ${{ matrix.check }}
      - name: Check public tree
        if: matrix.check == 'public-tree'
        run: |
          curl -fsSL https://raw.githubusercontent.com/legion-works/assist-live/main/tools/check_public_tree.py -o "$RUNNER_TEMP/check_public_tree.py"
          sha256sum "$RUNNER_TEMP/check_public_tree.py"
          if [ -n "${PRIVATE_DENYLIST:-}" ]; then
            uv run --no-project --python 3.14 python "$RUNNER_TEMP/check_public_tree.py" --history --root . --private-denylist "$PRIVATE_DENYLIST"
          else
            uv run --no-project --python 3.14 python "$RUNNER_TEMP/check_public_tree.py" --history --root .
          fi
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tgz"
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan history and files
        run: |
          gitleaks git . --redact --exit-code 1
          gitleaks dir . --redact --exit-code 1
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2
        with:
          version: "0.13.1"
          python-version: "3.14.3"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.38.1
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5
      - name: Build and check platform artifacts
        run: |
          for platform in linux/amd64 linux/arm64; do
            arch="${platform#linux/}"
            for target in service app; do
              docker buildx build --platform "$platform" --target "$target" --provenance=false --output "type=oci,dest=$RUNNER_TEMP/$target-$arch.tar" .
              uv run --locked python tools/check_release.py --image "$RUNNER_TEMP/$target-$arch.tar" --assets assets/manifest.json --expect-platform "$platform" --inventory "$RUNNER_TEMP/$target-$arch.json"
            done
          done
          uv run --locked python tools/check_release.py --image "$RUNNER_TEMP/service-arm64.tar" --assets assets/manifest.json --compare-inventory "$RUNNER_TEMP/service-amd64.json"
          uv run --locked python tools/check_release.py --image "$RUNNER_TEMP/app-arm64.tar" --assets assets/manifest.json --compare-inventory "$RUNNER_TEMP/app-amd64.json"
  ci-complete:
    needs: [checks, secret-scan, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["NEEDS_JSON"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          print("FAIL CI: " + ", ".join(failed) if failed else "PASS CI complete")
          sys.exit(bool(failed))
          PY
