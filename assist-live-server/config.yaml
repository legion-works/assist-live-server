name: assist-live-server
version: "0.0.0"
slug: assist-live-server
description: Experimental realtime voice server for Assist
url: https://github.com/legion-works/assist-live-server
arch:
  - amd64
  - aarch64
image: ghcr.io/legion-works/assist-live-server-app
startup: services
boot: manual
stage: experimental
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Assist WebSocket and health endpoint
options:
  stt_provider: parakeet
  tts_provider: piper
  local_only: true
  record_transcripts: false
  speaker_url: ""
  download_models: true
  deepgram_api_key: ""
  elevenlabs_api_key: ""
  elevenlabs_voice_id: ""
  elevenlabs_voice_name: ""
  elevenlabs_voice_language: ""
schema:
  stt_provider: list(parakeet|deepgram|none)
  tts_provider: list(piper|elevenlabs|none)
  local_only: bool
  record_transcripts: bool
  speaker_url: str
  download_models: bool
  deepgram_api_key: password
  elevenlabs_api_key: password
  elevenlabs_voice_id: str
  elevenlabs_voice_name: str
  elevenlabs_voice_language: str
