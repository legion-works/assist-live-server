[project]
name = "assist-live-workspace"
version = "0.0.0"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = ["assist-live-server", "assist-live-client"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["server", "client"]

[tool.uv.sources]
assist-live-server = { workspace = true }
assist-live-client = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.18",
    "PyYAML>=6",
    "types-PyYAML>=6",
    "numpy==2.5.4",
    "onnxruntime==1.31.0",
    "transformers==5.20.2",
]

[tool.pyright]
extraPaths = ["client", ".", "server"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["client", "server", "."]
explicit_package_bases = true
files = ["client", "server", "tools"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
