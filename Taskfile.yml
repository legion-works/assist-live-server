version: "3"

env:
  UV_LINK_MODE: copy
  ASSIST_LIVE_MODEL_CACHE:
    sh: 'printf "%s" "${ASSIST_LIVE_MODEL_CACHE:-${XDG_CACHE_HOME:-$HOME/.cache}/assist-live/turn}"'

tasks:
  format:
    cmds:
      - uv run --locked ruff format .
  lint:
    cmds:
      - uv run --locked ruff format --check .
      - uv run --locked ruff check .
      - uv run --locked python tools/check_ci.py
      - actionlint
  typecheck:
    cmds:
      - uv run --locked mypy
  unit:
    cmds:
      - uv run --locked python tools/tune_profiles.py --fetch-models
      - uv run --locked pytest -q
      - uv run --locked python tools/check_bootstrap.py
  contract:
    cmds:
      - uv run --locked python tools/check_ci.py --packages
  packaging:
    cmds:
      - uv run --locked python tools/check_ci.py --packages
  asset-license:
    cmds:
      - uv run --locked python tools/check_assets.py --manifest assets/manifest.json --release
  secret-scan:
    cmds:
      - gitleaks dir . --redact --exit-code 1
      - gitleaks git . --redact --exit-code 1
  public-tree:
    cmds:
      - |
        if [ ! -f ../assist-live/tools/check_public_tree.py ]; then
          printf 'NOT CHECKED public tree\n'
        elif [ -n "${PRIVATE_DENYLIST:-}" ]; then
          uv run --no-project --python 3.14 python ../assist-live/tools/check_public_tree.py --history --root . --private-denylist "$PRIVATE_DENYLIST"
        else
          uv run --no-project --python 3.14 python ../assist-live/tools/check_public_tree.py --history --root .
        fi
  check:
    cmds:
      - uv sync --locked
      - task: lint
      - task: typecheck
      - task: unit
      - task: contract
      - task: packaging
      - task: asset-license
      - task: secret-scan
      - task: public-tree
