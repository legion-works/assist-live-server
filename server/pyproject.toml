[project]
name = "assist-live-server"
version = "0.0.0"
requires-python = ">=3.14.2"
license = "Apache-2.0"
dependencies = ["aiohttp==3.14.5", "assist-live-client==0.0.0", "numpy==2.5.4", "onnxruntime==1.31.0", "onnx-asr==0.12.0", "piper-tts==1.8.0", "pathvalidate==3.3.1"]

[tool.uv.sources]
assist-live-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
