services:
  server:
    build: .
    image: assist-live-server:check
    ports:
      - "8099:8099"
    environment:
      ASSIST_LIVE_LOCAL_ONLY: "true"
      ASSIST_LIVE_RECORD_TRANSCRIPTS: "false"
    volumes:
      - server-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
volumes:
  server-data:
